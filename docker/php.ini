; FlatBB defaults for the Docker image. Uploads above 20 MB also need Admin → Settings → Uploads raised.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 60
expose_php = Off
; Admin → Updates replaces PHP files in place: opcache must notice
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
